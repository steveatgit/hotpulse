[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotpulse-agent"
version = "0.1.0"
description = "Interview-oriented agentic intelligence search MVP for breaking event tracking."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0.0",
]

[project.scripts]
hotpulse = "hotpulse_agent.cli:main"
hotpulse-eval = "hotpulse_agent.eval_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
